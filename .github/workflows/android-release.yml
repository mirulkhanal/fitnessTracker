name: Android Release

# Runs only after CI succeeds on master (not in parallel with lint).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Decide whether an APK rebuild is needed
        id: gate
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"
          MSG="$(git log -1 --format=%B "$SHA")"

          if printf '%s' "$MSG" | grep -qi '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=commit message contains [skip release]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip when every file changed since the last release tag is non-app
          # (CI/docs/tooling only). First release (no tags) always builds.
          LAST_TAG="$(git tag -l 'v*' --sort=-version:refname | head -1 || true)"
          if [[ -z "$LAST_TAG" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=no prior release tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED < <(git diff --name-only "$LAST_TAG".."$SHA")
          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no file changes since $LAST_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APP_CHANGE=0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              .github/*|*.md|.gitignore|commitlint.config.cjs|eslint.config.js|.husky/*|.vscode/*)
                ;;
              *)
                APP_CHANGE=1
                break
                ;;
            esac
          done

          if [[ "$APP_CHANGE" -eq 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=only CI/docs/tooling changed since $LAST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=app-related files changed since $LAST_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "Skipping Android release build: ${{ steps.gate.outputs.reason }}"

      - name: Setup pnpm
        if: steps.gate.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Expo SDK dependency versions
        if: steps.gate.outputs.skip != 'true'
        run: pnpm verify:expo

      - name: Cache Android SDK and Gradle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .android-sdk
            .gradle-local
          key: android-${{ runner.os }}-${{ hashFiles('scripts/setup-android-sdk.sh') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Setup Android SDK
        if: steps.gate.outputs.skip != 'true'
        run: pnpm setup:android-sdk

      - name: Build release APK
        if: steps.gate.outputs.skip != 'true'
        env:
          NODE_ENV: production
        run: |
          source .android-sdk.env
          pnpm build:android:local

      - name: Resolve release version
        if: steps.gate.outputs.skip != 'true'
        id: version
        env:
          RELEASE_VARIANT: release
        run: python3 scripts/resolve-release-version.py

      - name: Publish GitHub Release
        if: steps.gate.outputs.skip != 'true'
        run: |
          APK="$(ls -t dist/fittrack-*.apk | head -1)"
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.release_name }}"
          RELEASE_APK="FitTrack-Progress-${TAG}.apk"
          cp "$APK" "$RELEASE_APK"
          file "$RELEASE_APK"
          unzip -t "$RELEASE_APK" >/dev/null
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
