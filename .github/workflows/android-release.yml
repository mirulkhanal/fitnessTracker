name: Android Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Expo SDK dependency versions
        run: pnpm verify:expo

      - name: Cache Android SDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .android-sdk
            .gradle-local
          key: android-${{ runner.os }}-${{ hashFiles('scripts/setup-android-sdk.sh') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Setup Android SDK
        run: pnpm setup:android-sdk

      - name: Build release APK
        env:
          NODE_ENV: production
        run: |
          source .android-sdk.env
          pnpm build:android:local

      - name: Resolve release version
        id: version
        env:
          RELEASE_VARIANT: release
        run: python3 scripts/resolve-release-version.py

      - name: Publish GitHub Release
        run: |
          APK="$(ls -t dist/fittrack-*.apk | head -1)"
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.release_name }}"
          RELEASE_APK="FitTrack-Progress-${TAG}.apk"
          cp "$APK" "$RELEASE_APK"
          file "$RELEASE_APK"
          unzip -t "$RELEASE_APK" >/dev/null
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
